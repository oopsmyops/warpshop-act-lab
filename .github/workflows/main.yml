name: CI Checks (Expert)

on:
  push:
    branches: [ main, expert-challenge ]
  pull_request:
    branches: [ main, expert-challenge ]

jobs:
  build-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
        
      - name: Generate Report
        id: generate
        run: node report-generator.js

      - name: Upload Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: test-report.json

  run-tests:
    runs-on: ubuntu-latest
    needs: build-report
    strategy:
      matrix:
        node-version: ['18.20.8', '20.21.5'] 
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Download Report Artifact
        uses: actions/download-artifact@v4
        with:
          name: test-report
      
      - name: Validate Report
        run: |
          echo "Validating report using Node ${{ matrix.node-version }}..."
          if [ -f "test-report.json" ]; then
            echo "✅ Report found and validated."
          else
            echo "❌ Report not found!"
            exit 1
          fi

  summarize-for-pr:
    runs-on: ubuntu-latest
    needs: run-tests
    if: github.event_name == 'pull_request'
    steps:
      - name: Print PR Summary
        run: echo "This summary would be posted as a PR comment."